<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>{{CSS}}</style>
</head>
<body>
  <article class="report-shell">
    <header class="report-header">
      <div class="masthead">
        <div>
          <div class="kicker">ArXiv Education Brief</div>
          <p class="source-note">Recent-paper synthesis for fast technical orientation.</p>
        </div>
        <p class="generated-at">
          <span>Generated</span>
          <strong>{{GENERATED_AT}}</strong>
        </p>
      </div>
      <h1>{{TITLE}}</h1>
    </header>

    <section class="report-body" aria-label="Report content">
      {{CONTENT}}
    </section>

    <footer class="report-footer">
      <p>Source metadata from arXiv. Follow paper links for primary details.</p>
    </footer>
  </article>
</body>
</html>
